<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hormuz Watch — Naval Command Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#c9d3da;--panel:#eef2f4;--panel2:#e2e9ed;--ink:#13232e;--dim:#5b6f7c;--line:#c3cfd7;
  --accent:#b86e0e;--friend:#1c64c8;--hostile:#cf2424;--suspect:#d2700f;--unknown:#a88a06;--neutral:#1b8a4a;
  --sea:#d4e4ec;--sea2:#c3d9e5;--land:#ece3c8;--landEdge:#a3977a;--lane:#3a86a6;--grid:#b7cdd9;--textmap:#3d5a6b;
  --btn:#dfe6ea;--btnOn:#f6e2c4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050b11;--panel:#0b1620;--panel2:#10202c;--ink:#cfe0ea;--dim:#6f8898;--line:#1a2c3a;
    --accent:#e8a33d;--friend:#4aa8ff;--hostile:#ff4b4b;--suspect:#ff9a3c;--unknown:#f0d04a;--neutral:#5ad48a;
    --sea:#07192a;--sea2:#0a2236;--land:#141a13;--landEdge:#3e4b37;--lane:#2d7390;--grid:#10283a;--textmap:#86a9bc;
    --btn:#12222f;--btnOn:#2b2412;
  }
}
:root[data-theme="dark"]{
  --bg:#050b11;--panel:#0b1620;--panel2:#10202c;--ink:#cfe0ea;--dim:#6f8898;--line:#1a2c3a;
  --accent:#e8a33d;--friend:#4aa8ff;--hostile:#ff4b4b;--suspect:#ff9a3c;--unknown:#f0d04a;--neutral:#5ad48a;
  --sea:#07192a;--sea2:#0a2236;--land:#141a13;--landEdge:#3e4b37;--lane:#2d7390;--grid:#10283a;--textmap:#86a9bc;
  --btn:#12222f;--btnOn:#2b2412;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.45 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:280px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) 150px;
  grid-template-areas:"top top top" "left map right" "left log right";gap:1px;background:var(--line)}
#top{grid-area:top;background:var(--panel);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 12px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font:700 22px/1 "Barlow Condensed",Arial Narrow,sans-serif;letter-spacing:.06em;color:var(--accent)}
.brand span{font-size:10px;color:var(--dim);margin-top:3px}
.clock{display:flex;flex-direction:column;line-height:1.15}
#clk{font:600 20px/1 "Barlow Condensed",Arial Narrow,sans-serif;letter-spacing:.05em}
.dim{color:var(--dim)}
.grp{display:flex;align-items:center;gap:6px}
.lbl{color:var(--dim);font-size:10px}
.seg{display:inline-flex}
.seg .b{border-radius:0;margin-left:-1px}
.seg .b:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg .b:last-child{border-radius:0 3px 3px 0}
.b{background:var(--btn);border:1px solid var(--line);border-radius:3px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.b:hover{border-color:var(--dim)}
.b.on{background:var(--btnOn);border-color:var(--accent);color:var(--accent)}
.b[disabled]{opacity:.35;cursor:default}
.b.hold.on{color:var(--neutral);border-color:var(--neutral)}
.b.free.on{color:var(--hostile);border-color:var(--hostile)}
.tbar{width:120px;height:9px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--neutral) 0,var(--unknown) 60px,var(--hostile) 120px);background-size:120px 100%}
#stats{display:flex;gap:14px;flex-wrap:wrap}
#stats span b{font-weight:600}
.spacer{flex:1}
#left{grid-area:left;background:var(--panel);overflow:auto}
#right{grid-area:right;background:var(--panel);display:flex;flex-direction:column;min-height:0}
#mapwrap{grid-area:map;position:relative;min-height:0;background:var(--sea);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
#log{grid-area:log;background:var(--panel);overflow:auto}
.card{padding:10px 12px;border-bottom:1px solid var(--line)}
h3{font:600 15px/1.1 "Barlow Condensed",Arial Narrow,sans-serif;letter-spacing:.04em;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h3 small{font:11px "IBM Plex Mono",monospace}
.row{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;padding:4px 6px;cursor:pointer;border-radius:3px}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--btnOn);outline:1px solid var(--accent)}
.row.sub{padding-left:22px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .st{color:var(--dim);font-size:11px}
.hp{height:3px;background:var(--panel2);margin:1px 6px 4px}
.hp i{display:block;height:100%;background:var(--neutral)}
.rf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.rf:first-child{border-top:0}
.rf b{font-weight:600}
.plan{margin-top:10px;padding:8px;border:1px solid var(--accent);border-radius:4px;background:var(--panel2)}
.planhd{display:flex;justify-content:space-between;align-items:center}
.row.tsel{outline:2px solid var(--hostile);background:transparent}
.go2{width:100%;margin-top:8px;padding:7px;font-weight:600}
.unitname{font:700 20px/1.05 "Barlow Condensed",Arial Narrow,sans-serif;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.wt{width:100%;border-collapse:collapse;margin-top:6px}
.wt td{padding:3px 4px;border-top:1px solid var(--line)}
.wt td:last-child{white-space:nowrap}
.wt td:last-child .b{padding:3px 6px}
.wt td.n{text-align:right;color:var(--dim)}
.badge{display:inline-block;padding:0 5px;border:1px solid currentColor;border-radius:2px;font-size:10px;margin-right:4px}
.nmea{font-size:10.5px;word-break:break-all;background:var(--panel2);padding:6px 8px;border:1px solid var(--line);color:var(--accent);margin-top:6px}
#aisWrap{flex:1;overflow:auto;min-height:180px}
.at{width:100%;border-collapse:collapse;font-size:11px}
.at th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--dim);font-weight:500;padding:4px;border-bottom:1px solid var(--line)}
.at td{padding:3px 4px;white-space:nowrap;border-bottom:1px solid var(--line);cursor:pointer}
.at tr:hover td{background:var(--panel2)}
.at tr.sel td{background:var(--btnOn)}
.at tr.bad td:first-child{color:var(--hostile)}
.at tr.har td:first-child{color:var(--suspect)}
.lg{padding:3px 12px;border-bottom:1px solid var(--line);cursor:default}
.lg[data-act]{cursor:pointer}
.lg .t{color:var(--dim);margin-right:10px}
.lg.alert{color:var(--hostile)}
.lg.warn{color:var(--suspect)}
.lg.good{color:var(--neutral)}
#layers{position:absolute;left:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#zoom .b{width:32px;padding:4px 0}
#attrib{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;white-space:nowrap;color:#e8eef2;font-size:10px;text-shadow:0 0 3px #000;pointer-events:none}
#cursor{position:absolute;left:10px;bottom:8px;color:var(--textmap);font-size:11px;pointer-events:none}
#modeHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--accent);color:var(--panel);padding:5px 12px;border-radius:3px;display:none;font-weight:600}
#legend{position:absolute;right:10px;bottom:8px;display:flex;gap:10px;color:var(--textmap);font-size:10.5px;pointer-events:none;flex-wrap:wrap;justify-content:flex-end}
#legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px;border:1.5px solid}
#ov{position:fixed;inset:0;background:rgba(3,8,12,.72);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
#ov.hide{display:none}
.brief{max-width:760px;width:100%;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);padding:22px 26px}
.brief h1{font:700 34px/1 "Barlow Condensed",Arial Narrow,sans-serif;margin:0 0 4px;color:var(--accent);letter-spacing:.03em}
.brief h2{font:600 17px/1.2 "Barlow Condensed",Arial Narrow,sans-serif;margin:18px 0 6px}
.brief p{margin:6px 0;max-width:70ch}
.brief table{border-collapse:collapse;width:100%}
.brief td{padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.brief td:first-child{color:var(--accent);white-space:nowrap}
.brief .go{margin-top:18px;font-size:14px;padding:8px 18px}
.big{font:700 44px/1 "Barlow Condensed",Arial Narrow,sans-serif}
@media (max-width:1000px){
  body{height:auto;min-height:100%}
  #app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto auto 200px;
    grid-template-areas:"top" "map" "left" "right" "log"}
  #right{min-height:420px}
  #legend{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><b>HORMUZ WATCH</b><span>Combined Task Force · Strait of Hormuz</span></div>
    <div class="clock"><span id="clk">06:00:00Z</span><span id="elapsed" class="dim">T+0:00 of 6:00</span></div>
    <div class="grp"><span class="lbl">Time</span><div class="seg" id="tc"></div></div>
    <div class="grp"><span class="lbl">ROE</span><div class="seg" id="roe">
      <button class="b hold" data-act="roe" data-arg="HOLD" title="Self-defense only: engage only units that have fired on US forces">Hold</button>
      <button class="b" data-act="roe" data-arg="TIGHT" title="Engage contacts declared HOSTILE">Tight</button>
      <button class="b free" data-act="roe" data-arg="FREE" title="Engage anything not identified as friendly or neutral — including unidentified contacts">Free</button>
    </div></div>
    <div class="grp"><span class="lbl">Tension</span><div class="tbar"><i id="tbar"></i></div><span id="tval">10</span></div>
    <div id="stats"></div>
    <div class="spacer"></div>
    <button class="b" data-act="theme" title="Toggle light / dark">◐</button>
    <button class="b" data-act="save" title="Save to this browser (also autosaves)">Save</button>
    <button class="b" data-act="help" title="Briefing and controls">Briefing</button>
  </header>
  <aside id="left">
    <section class="card"><h3>Task group</h3><div id="oob"></div></section>
    <section class="card"><h3>Selected unit</h3><div id="unit"></div></section>
    <section class="card"><h3>Request forces</h3><div id="reinf"></div></section>
  </aside>
  <main id="mapwrap">
    <canvas id="map"></canvas>
    <div id="layers">
      <button class="b on" data-act="layer" data-arg="labels">Labels</button>
      <button class="b on" data-act="layer" data-arg="tss">Traffic lanes</button>
      <button class="b on" data-act="layer" data-arg="rings">Range rings</button>
      <button class="b" data-act="layer" data-arg="real">Realistic ships</button>
      <button class="b" data-act="layer" data-arg="sat">Satellite map</button>
    </div>
    <div id="zoom">
      <button class="b" data-act="zoom" data-arg="in" aria-label="Zoom in">+</button>
      <button class="b" data-act="zoom" data-arg="out" aria-label="Zoom out">−</button>
      <button class="b" data-act="zoom" data-arg="fit" aria-label="Fit whole area">⌖</button>
    </div>
    <div id="modeHint"></div>
    <div id="cursor"></div><div id="attrib"></div>
    <div id="legend">
      <span><i style="border-color:var(--friend);border-radius:50%"></i>Friendly</span>
      <span><i style="border-color:var(--neutral)"></i>Neutral / AIS</span>
      <span><i style="border-color:var(--unknown);border-radius:3px"></i>Unknown</span>
      <span><i style="border-color:var(--suspect);transform:rotate(45deg) scale(.8)"></i>Suspect</span>
      <span><i style="border-color:var(--hostile);transform:rotate(45deg) scale(.8)"></i>Hostile</span>
    </div>
  </main>
  <aside id="right">
    <section class="card"><h3>Contact</h3><div id="contact"></div></section>
    <section class="card" style="padding-bottom:4px"><h3>AIS feed <small id="aisCount"></small></h3></section>
    <div id="aisWrap"></div>
  </aside>
  <footer id="log"></footer>
</div>

<div id="ov"><div class="brief" id="brief"></div></div>

<script>

/* NMEA / AIVDM encoding (real 6-bit armoring and checksums) */
function bitw(){let b='';const put=(v,n)=>{v=Math.round(v);if(v<0)v+=Math.pow(2,n);b+=v.toString(2).padStart(n,'0').slice(-n);};const txt=(s,n)=>{s=(s||'').toUpperCase().padEnd(n,'@').slice(0,n);for(const ch of s){let c=ch.charCodeAt(0);if(c>=64&&c<96)c-=64;else if(!(c>=32&&c<64))c=32;put(c,6);}};return{put,txt,get:()=>b};}
function armor(bits){let s='';for(let i=0;i<bits.length;i+=6){const v=parseInt(bits.substr(i,6).padEnd(6,'0'),2);s+=String.fromCharCode(v<40?v+48:v+56);}return{s,fill:(6-bits.length%6)%6};}
function sent(body){let c=0;for(const ch of body)c^=ch.charCodeAt(0);return '!'+body+'*'+c.toString(16).toUpperCase().padStart(2,'0');}
function nmea1(m){const a=m.ais;if(!a)return '';const p=ll(a.x,a.y);const w=bitw();
  w.put(1,6);w.put(0,2);w.put(m.mmsi,30);w.put(a.nav,4);w.put(0,8);w.put(Math.min(1022,a.sog*10),10);w.put(1,1);
  w.put(p.lon*600000,28);w.put(p.lat*600000,27);w.put(norm(a.cog)*10%3600,12);w.put(Math.round(a.hdg)%360,9);w.put(a.sec,6);
  w.put(0,2);w.put(0,3);w.put(0,1);w.put(0,2);w.put(a.radio%8,3);w.put(a.radio,14);
  const r=armor(w.get());return sent(`AIVDM,1,1,,${m.mmsi%2?'A':'B'},${r.s},${r.fill}`);}
function nmea5(m){const w=bitw();const e=new Date(m.eta);
  w.put(5,6);w.put(0,2);w.put(m.mmsi,30);w.put(0,2);w.put(m.imo,30);w.txt(m.cs,7);w.txt(m.name,20);w.put(m.mt.st,8);
  const bow=Math.round(m.len*.85);w.put(Math.min(511,bow),9);w.put(Math.min(511,m.len-bow),9);const port=Math.round(m.beam/2);w.put(port,6);w.put(m.beam-port,6);
  w.put(1,4);w.put(e.getUTCMonth()+1,4);w.put(e.getUTCDate(),5);w.put(e.getUTCHours(),5);w.put(e.getUTCMinutes(),6);w.put(Math.min(255,m.draught*10),8);w.txt(m.dest,20);w.put(0,1);w.put(0,1);
  const r=armor(w.get());const q=m.mmsi%10;
  return [sent(`AIVDM,2,1,${q},A,${r.s.slice(0,60)},0`),sent(`AIVDM,2,2,${q},A,${r.s.slice(60)},${r.fill}`)];}

/* ---------------- movement ---------------- */
function turnTo(e,h,dt){const d=angDiff(e.hdg,h),m=e.turn*dt;e.hdg=norm(e.hdg+clamp(d,-m,m));}
function accel(e,v,dt){const a=e.acc*dt;e.spd+=clamp(v-e.spd,-a,a);if(e.spd<0)e.spd=0;}
function move(e,dt){const d=e.spd/3600*dt,nx=e.x+Math.sin(e.hdg*D2R)*d,ny=e.y-Math.cos(e.hdg*D2R)*d;
  if(e.side==='usn'&&!e.air&&inLand(nx,ny)){e.spd=0;e.wps=[];e.rearm=null;if(!e.grounded){e.grounded=true;log('warn',`${e.name}: all stop — shoal water ahead, orders cleared`,e.id);}return;}
  e.x=nx;e.y=ny;}
function steer(e,tx,ty,v,dt){turnTo(e,brg(e,{x:tx,y:ty}),dt);accel(e,v,dt);move(e,dt);}
function lead(e,t,v){const tt=Math.min(900,dist(e,t)/Math.max(v,1)*3600);return{x:t.x+Math.sin(t.hdg*D2R)*t.spd/3600*tt,y:t.y-Math.cos(t.hdg*D2R)*t.spd/3600*tt};}
function slot(t,i,r){const a=(t.hdg+[60,-60,120,-120,180,0][i%6])*D2R,q=r+.12*Math.floor(i/6);return{x:t.x+Math.sin(a)*q,y:t.y-Math.cos(a)*q};}
const aliveUSN=()=>ents.filter(u=>u.side==='usn'&&!u.dead&&(u.state==='sea'||u.state==='air'||u.state==='sub'));
const active=u=>u.state==='sea'||u.state==='air'||u.state==='sub';
function nearUSN(e,rs,ra){return ents.some(u=>u.side==='usn'&&!u.dead&&((u.state==='sea'&&dist(u,e)<rs)||(u.state==='air'&&u.type==='HELO'&&dist(u,e)<ra)));}
function nearestUSN(e,r){let b=null,bd=r;for(const u of ents)if(u.side==='usn'&&!u.dead&&u.state==='sea'){const d=dist(u,e);if(d<bd){bd=d;b=u;}}return b;}

function updUSN(e,dt){
  const Y=TYPES[e.type];
  if(e.state==='enroute'){if(T>=e.arrive){e.state=Y.sub?'sub':'sea';e.x=P_EAST.x;e.y=P_EAST.y;e.spd=Y.cruise;e.wps=[xy(59.3,24.45)];log('good',`${e.name} (${e.hull}) has arrived in the Gulf of Oman${Y.sub?' — submerged':''}`,e.id);}return;}
  if(e.state==='deck'){const h=byId(e.host);if(!h||h.dead){e.dead=true;return;}e.x=h.x;e.y=h.y;e.hdg=h.hdg;return;}
  if(e.state==='away'){if(T>=e.returnAt){const p=P_BAHRAIN;Object.assign(e,{state:'air',x:p.x,y:p.y,hdg:100,spd:330,fuel:Y.fuel,hp:e.maxHp,rtb:false,wps:[{...(e.orbit||xy(56.5,26.4))}]});e.mag.HARP=4;e.mag.MK54=5;log('info',`${e.name} (relief) airborne from Bahrain`,e.id);}return;}
  const vmax=Y.max*(e.hp/e.maxHp<.4?.55:1);
  let v=Math.min({stop:0,slow:Y.cruise*.45,cruise:Y.cruise,flank:vmax}[e.ord],vmax);
  if(e.type==='P8')v=Math.max(v,170);
  if(e.type==='LCS'&&e.mcm)v=Math.min(v,10);
  if(e.air){
    e.fuel-=dt;
    if(!e.rtb&&e.fuel<Y.fuel*.15){e.rtb=true;e.wps=[];e.escort=null;log('warn',`${e.name}: bingo fuel, returning`,e.id);}
    if(e.fuel<=0){e.dead=true;stats.usnLost++;score-=40;log('alert',`${e.name} out of fuel — aircraft lost`);return;}
    if(e.rtb){
      if(e.type==='HELO'){let h=byId(e.host);if(!h||h.dead){h=ents.find(u=>u.type==='DDG'&&!u.dead);if(h)e.host=h.id;}
        if(!h){accel(e,0,dt);return;}
        steer(e,h.x,h.y,Y.cruise,dt);
        if(dist(e,h)<.3){Object.assign(e,{state:'deck',rtb:false,ready:T+900,wps:[],escort:null,tgt:null,spd:0});log('info',`${e.name} recovered aboard ${h.name}; turnaround 15 min`,e.id);}
      }else{const p=P_BAHRAIN;steer(e,p.x,p.y,Y.cruise,dt);if(dist(e,p)<3){e.state='away';e.rtb=false;e.returnAt=T+2700;log('info',`${e.name} landed in Bahrain; relief in 45 min`,e.id);}}
      return;}
  }
  if(e.rearm){const r=e.rearm;
    if(r.until){accel(e,0,dt);move(e,dt);if(T>=r.until){e.mag=JSON.parse(JSON.stringify(e.mag0));e.hp=Math.min(e.maxHp,e.hp+e.maxHp*.5);e.rearm=null;log('good',`${e.name}: rearmed and repaired at ${r.port}`,e.id);}return;}
    if(dist(e,r)<1.2){r.until=T+(e.kind==='SUB'?10800:7200);e.wps=[];log('info',`${e.name} alongside ${r.port} — rearming, ${e.kind==='SUB'?3:2} hours`,e.id);return;}
    if(!e.wps.length)e.wps=[{x:r.x,y:r.y}];}
  if(e.escort){const t=byId(e.escort);
    if(!t||t.dead){e.escort=null;log('info',`${e.name}: escort complete`,e.id);}
    else{const h=t.hdg*D2R,ah=e.air?.6:1.0,ab=(e.air?1.4:.9)*(e.escSide||1);
      const p={x:t.x+Math.sin(h)*ah+Math.cos(h)*ab,y:t.y-Math.cos(h)*ah+Math.sin(h)*ab},d=dist(e,p);
      if(d>.25)steer(e,p.x,p.y,Math.min(vmax,t.spd+d*10+2),dt);else{turnTo(e,t.hdg,dt);accel(e,Math.min(vmax,t.spd),dt);move(e,dt);}
      return;}
  }
  if(e.wps.length){const w=e.wps[0];
    if(dist(e,w)<(e.air?.6:.2)){const done=e.wps.shift();if(e.patrol)e.wps.push(done);if(!e.wps.length&&e.air)e.orbit={x:done.x,y:done.y};}
    else{steer(e,w.x,w.y,v,dt);return;}
  }
  if(e.air){const o=e.orbit||(e.orbit={x:e.x,y:e.y}),r=e.type==='P8'?6:1.5;
    if(dist(e,o)>r*1.25)steer(e,o.x,o.y,e.type==='P8'?Y.cruise:Math.max(v*.6,50),dt);
    else{accel(e,e.type==='P8'?Y.cruise:Math.max(v*.6,50),dt);e.hdg=norm(e.hdg+(e.spd/3600/r)/D2R*dt);move(e,dt);}
  }else{accel(e,0,dt);move(e,dt);}
}

function updMerchant(e,dt){
  if(e.anchorUntil&&!e.disabled&&!e.seized){accel(e,0,dt);move(e,dt);aisTick(e);if(T>=e.anchorUntil)depart(e);return;}
  if(e.disabled){accel(e,0,dt);move(e,dt);aisTick(e);if(T-e.disabledAt>2400){e.gone=true;log('info',`${e.name} taken in tow and cleared from the lane`);}return;}
  if(e.hp/e.maxHp<.25){e.disabled=true;e.disabledAt=T;log('alert',`${e.name} disabled and on fire — not under command`,e.id);return;}
  const w=e.route[e.wi];if(!w){arrive(e);return;}
  if(dist(e,w)<.5){e.wi++;if(e.wi===e.gate+1&&!e.cleared&&!e.seized&&!e.dark){e.cleared=true;stats.transits++;score+=10;log('info',`${e.name} cleared the strait ${e.dir==='in'?'inbound':'outbound'}`,e.id);}if(e.wi>=e.route.length){arrive(e);return;}}
  const t=e.route[e.wi];let h=brg(e,t);
  for(const m of ents)if(m.kind==='MINE'&&m.known&&!m.dead&&dist(e,m)<2){const rb=angDiff(e.hdg,brg(e,m));if(Math.abs(rb)<25){h=norm(e.hdg+(rb<0?30:-30));break;}}
  let v=e.cruise*(e.hp/e.maxHp<.6?.6:1);if(e.harassed&&!e.seized)v=Math.min(v+2,rr(e.mt.spd)+2);
  turnTo(e,h,dt);accel(e,v,dt);move(e,dt);aisTick(e);
}
function arrive(e){e.gone=true;if(!e.seized&&!e.dark&&e.gate<0&&!EDGE_NODES.includes(e.to)){stats.voyages=(stats.voyages||0)+1;score+=3;log('info',`${e.name} arrived at ${PORTN[e.to]}`);return;}
  if(e.seized){log('alert',`${e.name} taken into ${e.seizePort||'Bandar Abbas'} under IRGCN guard`);return;}
}

function launch(sh,wk,t){const W=WPN[wk];if(!(sh.mag[wk]>0))return null;sh.mag[wk]--;
  return add({kind:'PRJ',w:wk,side:sh.side,src:sh.id,tgt:t.id,x:sh.x+rnd(-.05,.05),y:sh.y+rnd(-.05,.05),hdg:brg(sh,t),spd:W.spd,fuel:W.rng*1.4/W.spd*3600+10,threat:sh.side==='iran',air:!W.torp,torp:!!W.torp,sz:'S'});}
function dropMine(e){const m=add({side:'iran',kind:'MINE',x:e.x+rnd(-.05,.05),y:e.y+rnd(-.05,.05),known:false,sz:'S'});
  const seen=ents.some(s=>s.side==='usn'&&!s.dead&&active(s)&&dist(s,e)<=TYPES[s.type].vis);
  if(seen&&!e.hostileAct){hostileAct(e,false);m.known=true;log('alert',`${tn(e)}: dhow observed dropping objects into the traffic lane — MINELAYER, declared hostile`,e.id);}
  else if(seen)m.known=true;}

function subTargets(e,r){return ents.filter(s=>!s.dead&&((s.side==='merchant'&&!s.seized&&!s.disabled&&!s.dark)||(s.side==='usn'&&s.state==='sea'))&&dist(s,e)<r);}
function updSub(e,dt){const m=e.mis,Y=TYPES[e.type];
  const threat=ents.find(p=>p.kind==='PRJ'&&!p.dead&&p.tgt===e.id&&dist(p,e)<4);
  if(threat&&m.type!=='evade'){e.mis={type:'evade',until:T+600,hdg:norm(brg(threat,e)+rnd(-30,30)),fast:1};return;}
  if(m.type==='lurk'){
    if(!m.wp||dist(e,m.wp)<.5){let q=lanePoint().p;for(let k=0;k<4&&dist(q,e)>80;k++)q=lanePoint().p;m.wp=randSeaNear(q,5);}
    steer(e,m.wp.x,m.wp.y,Y.cruise,dt);
    if(tension>=45&&T>=(e.nextAtk||0)&&e.mag.T53>0){const tg=subTargets(e,8);if(tg.length){const t=pick(tg);e.mis={type:'stalk',tgt:t.id};}}
  }else if(m.type==='stalk'){const t=byId(m.tgt);if(!t||t.dead||t.seized){e.mis={type:'lurk'};return;}
    const d=dist(e,t);
    if(d>4.5){const L=lead(e,t,9);steer(e,L.x,L.y,9,dt);if(d>12)e.mis={type:'lurk'};}
    else{turnTo(e,brg(e,t),dt);accel(e,3,dt);move(e,dt);
      const n=Math.min(e.mag.T53,e.type==='KILO'?2:1);for(let i=0;i<n;i++)launch(e,'T53',t);
      hostileAct(e,t.side==='usn');e.nextAtk=T+2400;e.mis={type:'evade',until:T+900,hdg:norm(brg(t,e)+rnd(-50,50))};}
  }else if(m.type==='evade'){turnTo(e,m.hdg,dt);accel(e,Y.max*(m.fast?1:.6),dt);move(e,dt);if(inLand(e.x+Math.sin(e.hdg*D2R)*.5,e.y-Math.cos(e.hdg*D2R)*.5))m.hdg=norm(m.hdg+90);if(T>m.until)e.mis={type:e.mag.T53>0?'lurk':'rtb'};}
  else{const b=BASES.BA;steer(e,b.x,b.y,Y.cruise+2,dt);if(dist(e,b)<.6)e.gone=true;}
}
function updIran(e,dt){
  if(e.kind==='SITE'){const s=e.salvo;if(s&&T>=s.next){const t=byId(s.tgt);
      if(t&&!t.dead&&e.mag.NOOR>0&&s.n>0){launch(e,'NOOR',t);s.n--;s.next=T+rnd(3,8);
        if(!s.logged){s.logged=true;hostileAct(e,t.side==='usn');log('alert',`Missile launch detected from coastal battery on ${e.loc} — site located`,e.id);}}
      else e.salvo=null;}
    return;}
  if(e.kind==='SUB'){updSub(e,dt);return;}
  if(e.kind!=='BOAT')return;
  const m=e.mis,Y=TYPES[e.type];
  switch(m.type){
  case 'harass':{const t=byId(m.tgt);
    if(!t||t.dead||t.disabled){toRTB(e);break;}
    if(t.seized){m.type='escortSeized';break;}
    if(e.firedOn){if(tension<55)groupRTB(e.gid,'fleeing after coming under fire');else groupAttack(e.gid);break;}
    const d=dist(e,t);
    if(d>.6){const L=lead(e,t,Y.max);steer(e,L.x,L.y,Y.max,dt);}
    else{const o=slot(t,e.slot,.25);steer(e,o.x,o.y,clamp(t.spd+dist(e,o)*30,0,Y.max),dt);}
    if(nearUSN(e,2.5,1.2)){e.deter+=dt;if(e.deter>e.resolve&&tension<70)groupRTB(e.gid,`breaking off from ${t.name}`);}
    break;}
  case 'escortSeized':{const t=byId(m.tgt);
    if(!t||t.dead||!t.seized){toRTB(e);break;}
    if(e.firedOn&&tension<55){groupRTB(e.gid,'abandoning the seized vessel under fire');break;}
    const o=slot(t,e.slot,.3);steer(e,o.x,o.y,clamp(t.spd+dist(e,o)*30,0,Y.max),dt);
    if(nearUSN(e,1.2,.8)){e.deter+=dt;if(e.deter>e.resolve*1.6&&tension<75)groupRTB(e.gid,`leaving ${t.name} under US pressure`);}
    break;}
  case 'attack':{let t=byId(m.tgt);
    if(!t||t.dead||t.state==='deck'||t.state==='away'){t=nearestUSN(e,20);if(t)m.tgt=t.id;else{toRTB(e);break;}}
    const d=dist(e,t);
    if(d>.8){const L=lead(e,t,Y.max);steer(e,L.x,L.y,Y.max,dt);}
    else{const a=(brg(t,e)+25)*D2R;steer(e,t.x+Math.sin(a)*.7,t.y-Math.cos(a)*.7,Y.max*.8,dt);}
    if(!e.hostileAct&&d<3){hostileAct(e,false);const g=groups[e.gid];if(g&&!g.intent&&e.track){g.intent=1;log('alert',`Hostile intent: IRGCN boats closing ${t.name} at high speed — declared hostile`,e.id);}}
    break;}
  case 'missile':{const t=byId(m.tgt);if(!t||t.dead){toRTB(e);break;}
    const d=dist(e,t);
    if(d>13){steer(e,t.x,t.y,Y.max,dt);
      if(d<20&&!e.hostileAct){hostileAct(e,false);const g=groups[e.gid];if(g&&!g.fc){g.fc=1;log('alert','ESM: fire-control radar lock from IRGCN missile boats — HOSTILE INTENT',e.id);}}}
    else{turnTo(e,brg(e,t),dt);accel(e,Y.cruise,dt);move(e,dt);
      if(e.mag.C704>0){if((e.cd.C704||0)<=T){launch(e,'C704',t);e.cd.C704=T+4;hostileAct(e,t.side==='usn');}}else toRTB(e);}
    break;}
  case 'mine':{
    if(!m.stage){steer(e,m.pt.x,m.pt.y,Y.cruise+1,dt);if(dist(e,m.pt)<.3){m.stage=1;m.next=T+rnd(10,30);}}
    else{turnTo(e,m.hdg,dt);accel(e,6,dt);move(e,dt);if(T>=m.next){dropMine(e);m.left--;m.next=T+rnd(40,70);if(m.left<=0)toRTB(e);}}
    break;}
  case 'wander':{
    if(m.fishUntil>T){accel(e,0,dt);move(e,dt);break;}
    if(!m.wp||dist(e,m.wp)<.3){if(m.wp&&Math.random()<.5){m.fishUntil=T+rnd(600,2400);m.wp=null;break;}m.wp=randSeaNear(m.home,8);}
    steer(e,m.wp.x,m.wp.y,Y.cruise,dt);break;}
  case 'rtb':default:{const b=BASES[e.base]||BASES.BA;steer(e,b.x,b.y,Y.cruise,dt);if(dist(e,b)<.6)e.gone=true;}
  }
}

/* director: Iranian escalation logic */
function inReach(e,r){return dist(e,BASES[nearestBase(e)])<(r||70);}
function launchHarass(){
  const c=ents.filter(e=>e.side==='merchant'&&!e.dead&&!e.seized&&!e.dark&&!e.disabled&&!e.anchorUntil&&inReach(e,60));const anch=ents.filter(e=>e.side==='merchant'&&e.anchorUntil&&!e.seized&&inReach(e,80));if(anch.length&&Math.random()<.2)c.push(pick(anch));if(!c.length)return;
  const esc=new Set(ents.filter(u=>u.escort).map(u=>u.escort)),free=c.filter(x=>!esc.has(x.id));
  const t=pick(free.length&&Math.random()<.75?free:c);
  spawnGroup(ri(2,4)+(tension>40?1:0),'FIAC',nearestBase(t),{type:'harass',tgt:t.id},'harass');}
const MINE_EDGES=[['I1','I2'],['I2','I3'],['I3','I4'],['I4','I5'],['O1','O2'],['O2','O3'],['O3','O4'],['O4','O5'],['GO2','GO3'],['G1','GW'],['G1','G2'],['G2','G3'],['G2','RT'],['G3','KH'],['GO1','GO2'],['FUJ','GO3']];
function lanePoint(){const [a,b]=pick(MINE_EDGES),A=NODES[a],B=NODES[b],f=rnd(.1,.9);return{p:{x:A.x+(B.x-A.x)*f+rnd(-.6,.6),y:A.y+(B.y-A.y)*f+rnd(-.6,.6)},h:brg(A,B)};}
function launchMinelayer(){const L=lanePoint(),bk=nearestBase(L.p),b=BASES[bk];
  add({side:'iran',kind:'BOAT',type:'DHOW',name:'Dhow',x:b.x,y:b.y,hdg:0,spd:0,turn:3,acc:.3,hp:5,maxHp:5,sz:'S',base:bk,mis:{type:'mine',pt:L.p,hdg:L.h,left:3}});}
function launchDrones(){const tg=ents.filter(e=>e.side==='merchant'&&!e.dead&&!e.dark&&!e.seized&&!e.disabled);if(!tg.length)return;
  const t=pick(tg);const o=DRONE_PTS.slice().sort((p,q)=>dist(xy(p[0],p[1]),t)-dist(xy(q[0],q[1]),t))[ri(0,2)];for(let i=0,n=ri(1,3);i<n;i++){const p=xy(o[0]+rnd(-.05,.05),o[1]+rnd(-.05,.05));
    add({kind:'PRJ',w:'SHAHED',side:'iran',tgt:t.id,x:p.x,y:p.y,hdg:brg(p,t),spd:WPN.SHAHED.spd,fuel:5*3600,threat:true,air:true,sz:'S'});}}
function launchFACM(){const us=ents.filter(u=>u.side==='usn'&&u.state==='sea'&&!u.dead),me=ents.filter(e=>e.side==='merchant'&&!e.dead&&!e.dark&&!e.seized&&inReach(e,60));
  const usr=us.filter(u=>inReach(u,70));const t=Math.random()<.6&&usr.length?pick(usr):(me.length?pick(me):null);if(!t)return;spawnGroup(2,'FACM',nearestBase(t),{type:'missile',tgt:t.id},'missile');}
function siteSalvo(){const s=ents.filter(x=>x.kind==='SITE'&&!x.dead&&x.mag.NOOR>0&&!x.salvo);if(!s.length)return;const site=pick(s);
  const me=ents.filter(e=>e.side==='merchant'&&!e.dead&&!e.dark&&!e.seized&&dist(e,site)<70),us=ents.filter(u=>u.side==='usn'&&u.state==='sea'&&!u.dead&&dist(u,site)<70);
  const t=Math.random()<.3&&us.length?pick(us):(me.length?pick(me):(us.length?pick(us):null));if(!t)return;
  site.salvo={n:ri(1,2)+(tension>85?1:0),tgt:t.id,next:T+rnd(0,10)};}
function swarm(){const us=ents.filter(u=>u.side==='usn'&&u.state==='sea'&&!u.dead);if(!us.length)return;const t=pick(us),bk=nearestBase(t);if(dist(BASES[bk],t)>45)return;
  spawnGroup(ri(5,8),'FIAC',bk,{type:'attack',tgt:t.id},'swarm');}
function intelUpdate(){intelDone=true;intelDeadline=Math.min(DUR,T+Math.min(43200,9000*Heff()/6));
  for(const s of ents)if(s.kind==='SITE'&&(s.sub==='NUKE'||s.sub==='SAM')){s.revealed=true;s.cls='HOSTILE';s.ordered=true;if(!s.track)s.track=nextTrack++;}
  log('alert',`FLASH — INTEL UPDATE: strike ordered on three nuclear facilities. Deadline ${clockStr(intelDeadline)}.`);
  setComp(0);showIntel();}
function director(){
  if(!intelDone&&(T>=intelAt||tension>=65)){intelUpdate();return;}
  if(tension>=55&&ents.filter(e=>e.kind==='SUB'&&e.side==='iran').length<5&&Math.random()<.02){const b=pick([[56.35,27.0],[52.5,27.25],[57.7,25.5],[60.5,25.15]]);mkSub(Math.random()<.3?'KILO':'GHADIR',Math.random()<.3?'IRIS Yunes (903)':'Ghadir-class midget submarine',b[0],b[1]);}
  bump((20/60)*.33*(6/Heff()));if(T-lastSpike>1800&&tension>15)tension=Math.max(15,tension-.06);
  if(ents.filter(e=>e.side==='civ').length<20)spawnCiv();
  if(T>=nextMerchT){if(ents.filter(e=>e.side==='merchant').length<78)mkMerchant('spawn',Math.random()<.05?{dark:true}:null);nextMerchT=T+rnd(100,200);}
  if(!scripted&&T>150){scripted=true;launchHarass();return;}
  const act=new Set(ents.filter(e=>e.side==='iran'&&e.kind==='BOAT'&&e.mis&&e.mis.type!=='rtb'&&e.type==='FIAC').map(e=>e.gid)).size;
  const p=tension;
  if(act<1+Math.floor(p/22)&&Math.random()<.13)launchHarass();
  if(p>=30&&ents.filter(e=>e.mis&&e.mis.type==='mine').length<3&&Math.random()<.025+p/4000)launchMinelayer();
  if(p>=45&&Math.random()<.012+(p-45)/3000)launchDrones();
  if(p>=58&&Math.random()<.014)launchFACM();
  if(p>=68&&Math.random()<.01+(p-68)/3000)siteSalvo();
  if(p>=82&&Math.random()<.008)swarm();
}

/* ---------------- sensors ---------------- */
function srange(s,e){const Y=TYPES[s.type];if(e.kind==='PRJ')return WPN[e.w].drone?Y.radD:Y.radM;return Y.radS*(SZF[e.sz]||1);}
function trueCls(e){if(e.side==='iran'&&(e.type==='FIAC'||e.type==='FACM'||e.kind==='SUB'))return 'SUSPECT';return 'NEUTRAL';}
function idName(e){if(e.type==='KILO')return 'Kilo-class submarine (Tareq class) — acoustic classification';if(e.type==='GHADIR')return 'Ghadir-class midget submarine — acoustic classification';if(e.type==='FIAC')return 'IRGCN fast attack craft';if(e.type==='FACM')return 'IRGCN missile boat';if(e.type==='DHOW')return 'wooden dhow, fishing gear visible';if(e.dark)return `tanker ${e.name}, AIS dark — suspected sanctions evasion`;return e.name||'vessel';}
function detect(){
  const S=aliveUSN();
  for(const e of ents){
    if(e.dead||e.side==='usn'||e.kind==='SITE')continue;
    if(e.kind==='PRJ'&&!e.threat)continue;
    if(e.kind==='MINE'){if(!e.known)for(const s of S)if(s.type==='LCS'&&s.mcm&&s.spd<=12.5&&dist(s,e)<1.6){e.known=true;log('warn',`${s.name}: mine-like object detected in the lane — marked`,e.id);break;}continue;}
    if(e.side==='merchant'&&e.aisOn){e.det=true;e.lastSeen=T;e.lx=e.x;e.ly=e.y;e.cls='NEUTRAL';continue;}
    let seen=false,vis=false;
    if(e.kind==='SUB'){for(const s of S){let r=SONAR[s.type]||0;if(s.type==='HELO'&&s.spd>40)r=0;if(e.type==='GHADIR')r*=.7;if(e.spd>8)r*=1.6;if(s.state==='sub'&&s.spd>15)r*=.5;if(dist(s,e)<=r)seen=true;}
      if(seen){e.trackT=(e.trackT||0)+1;if(e.trackT>=45)vis=true;}else e.trackT=Math.max(0,(e.trackT||0)-3);}
    else if(e.kind==='PRJ'&&e.torp){const tg=byId(e.tgt);seen=(tg&&tg.side==='usn')||S.some(s=>dist(s,e)<=(TORPEAR[s.type]||0));}
    else for(const s of S){const d=dist(s,e);if(d<=srange(s,e)){seen=true;if(e.kind!=='PRJ'&&d<=TYPES[s.type].vis&&s.state!=='sub'||(s.state==='sub'&&d<=5&&e.kind!=='PRJ'))vis=true;}}
    if(seen){
      if(!e.track){e.track=nextTrack++;if(e.kind==='PRJ'){const tg=byId(e.tgt);log('alert',`${e.torp?'TORPEDO IN THE WATER':WPN[e.w].drone?'DRONE':'VAMPIRE'} — TN ${e.track}, ${WPN[e.w].n} inbound${tg?' on '+tn(tg):''}`,e.id);}}
      e.det=true;e.lastSeen=T;e.lx=e.x;e.ly=e.y;
      if(!e.cls)e.cls=e.kind==='PRJ'?'HOSTILE':'UNK';
      if(vis&&!e.idd){e.idd=true;e.cls=trueCls(e);log(e.kind==='SUB'?'warn':'info',`${e.kind==='SUB'?'Sonar':'Visual'} ID — TN ${e.track}: ${idName(e)}`,e.id);}
    }else e.det=false;
    if(e.hostileAct&&e.track)e.cls='HOSTILE';
  }
}
function visible(e){if(e.dead||e.gone)return false;if(e.kind==='PRJ')return !e.threat||!!e.det;if(e.side==='usn')return active(e);
  if(e.kind==='MINE')return e.known;if(e.kind==='SITE')return e.revealed;if(e.kind==='PRJ')return !e.threat||e.det;
  if(e.side==='merchant'&&(e.aisOn||e.seized))return true;return e.det||(e.track&&T-e.lastSeen<300);}
const dpos=e=>(e.side==='usn'||e.det||e.kind==='SUB'&&T-e.lastSeen<5||e.kind==='PRJ'||e.kind==='MINE'||e.kind==='SITE'||(e.side==='merchant'&&!e.dark))?e:{x:e.lx,y:e.ly};

/* ---------------- weapons ---------------- */
function boom(x,y,s){fx.push({k:'boom',x,y,s,t:performance.now(),sd:Math.random()*6});}
function firedOn(t){if(!t.firedOn){t.firedOn=true;if(t.side==='iran'||t.side==='civ')bump(2);}}
function gun(sh,wk,t){const W=WPN[wk],d=dist(sh,t);if(d>W.rng||(sh.cd[wk]||0)>T)return false;sh.cd[wk]=T+W.rof;if(sh.mag[wk]<9000)sh.mag[wk]--;
  fx.push({k:'tr',x1:sh.x,y1:sh.y,x2:t.x,y2:t.y,c:sh.side==='usn'?'friend':'hostile',t:performance.now()});
  let pk=W.pk*(1-.5*d/W.rng);if(t.air)pk*=.35;if(t.kind==='BOAT'&&t.spd>30)pk*=.7;if(Math.random()<pk)damage(t,W.dmg,sh);return true;}
function damage(t,dmg,src){if(t.dead)return;t.hp-=dmg*rnd(.75,1.25);if(src&&src.w&&WPN[src.w].torp)boom(t.x,t.y,'w');boom(t.x,t.y,dmg>25?'b':'s');
  const wn=src&&src.w?WPN[src.w].n:(src&&src.kind==='MINE'?'a mine':'gunfire');
  if(t.side==='merchant'){if(!t.hitOnce){t.hitOnce=true;stats.hit++;score-=20;}if(t.hp>0&&(!t.lastHit||T-t.lastHit>20)){t.lastHit=T;log('alert',`${tn(t)} hit by ${wn}`,t.id);}}
  if(t.side==='usn'&&t.hp>0&&(!t.lastHit||T-t.lastHit>20)){t.lastHit=T;log('alert',`${t.name} hit by ${wn} — ${Math.round(t.hp/t.maxHp*100)}% integrity`,t.id);}
  if(t.hp<=0)kill(t,src);}
function kill(t,src){t.dead=true;const bigK=t.kind==='SITE'||t.kind==='SHIP'||t.kind==='SUB';boom(t.x,t.y,bigK?'h':'b');if(t.kind!=='PRJ'&&!t.air)fx.push({k:'burn',x:t.x,y:t.y,until:T+(bigK?5400:600),s:bigK?1:.5,site:t.kind==='SITE'});const by=src&&src.side;
  if(t.kind==='SITE'&&t.sub==='NUKE'){stats.nukes++;score+=150;bump(15);log('good',`${t.name} destroyed — battle damage assessment confirms the ${t.loc} is out of action`);
    if(!ents.some(x=>x.sub==='NUKE'&&!x.dead)){score+=100;intelResolved=true;log('good','All three nuclear facilities destroyed. Strike mission complete.');}return;}
  if(t.kind==='SUB'&&by==='usn'){stats.subs++;stats.irnKilled++;score+=25;bump(8);log('good',`${tn(t)} (${t.type==='KILO'?'Kilo-class':'Ghadir-class'} submarine) destroyed`);return;}
  if(t.side==='merchant'){stats.sunk++;score-=60;log('alert',`${tn(t)} lost — abandoning ship`);}
  else if(t.side==='usn'){stats.usnLost++;score-=t.kind==='SHIP'?150:40;log('alert',`${t.name} ${t.hull?'('+t.hull+') ':''}lost`);}
  else if(t.side==='civ'){stats.civKilled++;score-=80;bump(10);log('alert',`Civilian fishing dhow destroyed by ${by==='usn'?'US fire':'hostile fire'} — international outcry`);}
  else if(t.side==='iran'&&t.kind!=='PRJ'&&by==='usn'){stats.irnKilled++;score+=8;bump((t.kind==='SITE'?8:5));log('good',`${t.kind==='SITE'?(t.sub==='SAM'?'SAM battery '+t.loc:'Coastal missile battery on '+t.loc):tn(t)+' ('+(t.idd?idName(t):'boat')+')'} destroyed`);}}
function updPrj(p,dt){p.fuel-=dt;const t=byId(p.tgt),step=p.spd/3600*dt;
  if(p.wps&&p.wps.length){const w=p.wps[0];if(dist(p,w)<=step+.05)p.wps.shift();else p.hdg=brg(p,w);}
  else if(t&&!t.dead){if(dist(p,t)<=step+.03){p.dead=true;impact(p,t);return;}p.hdg=brg(p,t);}
  else if(!p.threat){p.dead=true;boom(p.x,p.y,'m');return;}
  p.x+=Math.sin(p.hdg*D2R)*step;p.y-=Math.cos(p.hdg*D2R)*step;
  if(!p.trail)p.trail=[{x:p.x,y:p.y}];const lt=p.trail[p.trail.length-1];if(dist(lt,p)>=Math.max(.03,p.spd/3600*5)){p.trail.push({x:p.x,y:p.y});if(p.trail.length>50)p.trail.shift();}
  if(p.fuel<=0){p.dead=true;boom(p.x,p.y,'m');}}
function impact(p,t){const W=WPN[p.w];

  document.querySelectorAll('#roe .b').forEach(b=>b.classList.toggle('on',b.dataset.arg===roe));
  $('#tbar').style.width=tension.toFixed(0)+'%';$('#tval').textContent=tension.toFixed(0);
  setHTML($('#stats'),`<span>Transits <b>${stats.transits}</b></span><span>Port calls <b>${stats.voyages||0}</b></span><span>Seized <b style="color:${stats.seized?'var(--hostile)':'inherit'}">${stats.seized}</b></span><span>Merchants hit <b>${stats.hit}</b></span><span>US losses <b>${stats.usnLost}</b></span>${intelDone?`<span>Nuclear sites <b style="color:${stats.nukes===NUKES.length?'var(--neutral)':'var(--hostile)'}">${stats.nukes}/${NUKES.length}</b>${intelResolved?'':' · due '+clockStr(intelDeadline)}</span>`:''}<span>Score <b style="color:var(--accent)">${score}</b></span>`);
  setHTML($('#reinf'),Object.entries(REINF).map(([k,R])=>`<div class="rf"><div><b>${R.label}</b><div class="dim">${R.desc}. ${R.pool.length?`Next: ${esc(R.pool[0][0])} · ETA ${Math.round(R.eta/60)} min`:'None left'}</div></div><button class="b" data-act="reinf" data-arg="${k}" ${R.pool.length&&started&&!over?'':'disabled'}>Request</button></div>`).join(''));
  setHTML($('#oob'),oobHTML());setHTML($('#unit'),unitHTML(byId(selU)));setHTML($('#contact'),contactHTML(byId(selC)));setHTML($('#aisWrap'),aisHTML());
  if(logDirty||force){logDirty=false;setHTML($('#log'),logs.map(l=>`<div class="lg ${l.cls}" ${l.ref?`data-act="logref" data-arg="${l.ref}"`:''}><span class="t">${clockStr(l.t)}</span>${esc(l.msg)}</div>`).join(''));}}

/* ---------------- save / load ---------------- */
const SAVE_KEY='hormuz-watch-save-v1';
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function saveGame(manual){if(!started||over)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,T,tension,score,nid,nextTrack,nextMerchT,scripted,roe,intelDone,intelDeadline,intelResolved,intelAt,heloN,gidN,groups,stats,logs:logs.slice(0,80),ents,pools:Object.fromEntries(Object.entries(REINF).map(([k,R])=>[k,R.pool])),used:[...usedNames],H:H===Infinity?-1:H,lastSpike,saved:Date.now()}));if(manual)log('good','Game saved in this browser');}catch(e){if(manual)log('warn','Save failed — browser storage is unavailable');}}
function saveInfo(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));return d&&{T:d.T,score:d.score,H:d.H,when:new Date(d.saved).toLocaleString()};}catch(e){return null;}}
function loadGame(){let d;try{d=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}if(!d)return;
  ({T,tension,score,nid,nextTrack,nextMerchT,scripted,roe,intelDone,intelDeadline,intelResolved,intelAt,heloN,gidN,lastSpike}=d);
  H=d.H<0?Infinity:d.H;DUR=H*3600;Object.assign(stats,d.stats);for(const k in groups)delete groups[k];Object.assign(groups,d.groups);
  logs.length=0;logs.push(...d.logs);ents=d.ents;idx=new Map(ents.map(e=>[e.id,e]));for(const k in d.pools)REINF[k].pool=d.pools[k];
  usedNames.clear();d.used.forEach(n=>usedNames.add(n));selU=(ents.find(e=>e.side==='usn'&&active(e))||{}).id||null;selC=null;fx.length=0;
  started=true;running=true;over=false;$('#ov').classList.add('hide');setComp(0);log('info','Saved watch restored — press a time speed to continue');logDirty=true;}
addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(false);});
/* ---------------- briefing / debrief ---------------- */
function showBrief(resume){$('#ov').classList.remove('hide');$('#brief').innerHTML=`
<h1>Hormuz Watch</h1><div class="dim">Fictional scenario · 0600Z · Strait of Hormuz</div>
<p>Tensions with Iran are rising. Your task group must keep merchant traffic moving across the whole theater — from Kuwait and Ras Tanura down through the Strait of Hormuz to Fujairah and the Arabian Sea — for the next six hours. Every ship that clears the strait counts. Every seizure, hit, or loss counts against you — and so does every shot that makes things worse.</p>
<h2>Your forces</h2>
<p>Four Arleigh Burke destroyers, each with an MH-60R Seahawk, patrolling their own sectors: USS Gridley in the northern Gulf, Paul Ignatius in the central Gulf, Thomas Hudner at the strait, and Delbert D. Black in the Gulf of Oman. USS Canberra (mine countermeasures) sits just west of the strait, and two P-8A Poseidons fly from Bahrain. Ships start on patrol loops — clear their orders to take direct control. Use <b>Request forces</b> to call in more destroyers, Virginia-class attack submarines, or an Ohio-class guided-missile submarine; they arrive from the Arabian Sea.</p>
<h2>What to expect</h2>
<p>IRGC Navy fast boats operate from bases all along the Iranian coast — Bushehr, Farsi Island, Asaluyeh, Kish, the strait islands, Jask and Chabahar — and will swarm merchants (including ships riding at anchor off Fujairah) and try to board them. A merchant left alone with boarders for about two and a half minutes will be seized and taken toward Bandar Abbas — a US warship close aboard can free her if the guards leave. As tension climbs, expect covert minelaying by dhows, one-way attack drones, missile boats, and coastal anti-ship missile batteries. Fishing dhows share the same waters and look identical on radar until someone gets close enough to see them.</p>
<p>Iran's Kilo and Ghadir-class submarines are hiding near the lanes. They only show up on sonar — your submarines hear farthest, then destroyers, the P-8, and hovering helicopters. Hunt them with Mk 48, Mk 54 and ASROC torpedoes. Expect new orders from intelligence during the watch.</p>
<h2>Rules of engagement</h2>
<p><b>Hold</b> — fire only at units that have fired on US forces. <b>Tight</b> — engage contacts declared hostile (they committed a hostile act or showed hostile intent). <b>Free</b> — engage anything not identified as friendly or neutral, including unidentified contacts. Air defense against missiles and drones is always automatic. Destroying Iranian units raises tension; so does killing civilians.</p>
<h2>Controls</h2>
<table>
<tr><td>Select</td><td>Click a unit or contact. Tab cycles your units.</td></tr>
<tr><td>Move</td><td>Right-click the map (Shift adds a waypoint). On touch, long-press, or use the Move button.</td></tr>
<tr><td>Escort</td><td>Right-click a merchant with a unit selected, or press E.</td></tr>
<tr><td>Engage</td><td>Select a contact, then Fire/Engage in the unit's weapons table.</td></tr>
<tr><td>Map</td><td>Drag to pan, scroll or pinch to zoom.</td></tr>
<tr><td>Strike</td><td>Select a ship or submarine with Tomahawks, press T or Plan strike, pick a target, add up to 5 waypoints, choose a salvo, launch. Right-click a land site to jump straight to it.</td></tr>
<tr><td>Time</td><td>Space pauses; keys 1–8 set 1× to 300×. Slow on alerts drops to 5× when something happens.</td></tr>
</table>
${resume?'<button class="b on go" data-act="start">Resume</button> <button class="b go" data-act="save">Save game</button>':`<h2>Length of watch</h2><div class="seg">${[[6,'6 hours'],[24,'24 hours'],[72,'3 days'],[0,'Endless']].map(([v,l])=>`<button class="b ${lenSel===v?'on':''}" data-act="len" data-arg="${v}">${l}</button>`).join('')}</div>
<p class="dim">Longer watches escalate more slowly — tension also cools off when things stay quiet — and the intel strike order comes later. Ships can return to port to rearm. The game autosaves in this browser.</p>
<button class="b on go" data-act="start">Take command</button>${(()=>{const i=saveInfo();return i?` <button class="b go" data-act="load">Continue saved watch (T+${Math.floor(i.T/3600)}h${String(Math.floor(i.T%3600/60)).padStart(2,'0')}, score ${i.score})</button>`:'';})()}`}`;}
function showIntel(){$('#ov').classList.remove('hide');const ns=ents.filter(x=>x.sub==='NUKE');$('#brief').innerHTML=`
<h1 style="color:var(--hostile)">Intel update</h1><div class="dim">FLASH · ${clockStr(T)}</div>
<p>Overnight imagery shows trucks moving material out of three hardened nuclear facilities in southern Iran. The National Command Authority has ordered them destroyed before ${clockStr(intelDeadline)}. These targets are cleared for strike under any ROE setting.</p>
<table>${ns.map(n=>`<tr><td>${esc(n.name)}</td><td>${esc(n.loc)} · ${fmtLL(n.x,n.y)} <button class="b" data-act="intelsel" data-arg="${n.id}">Select</button></td></tr>`).join('')}</table>
<p>Each site is ringed by two SAM batteries. Select a site, then fire Tomahawks from any destroyer or submarine. You can request an Ohio-class guided-missile submarine for a heavy strike. Expect a violent response from Iran once missiles are in the air.</p>
<button class="b on go" data-act="start">Acknowledge</button>`;}
function endGame(why){if(over)return;over=true;running=false;comp=0;try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  if(intelDone&&!intelResolved){intelResolved=true;const left=ents.filter(x=>x.sub==='NUKE'&&!x.dead).length;score-=100*left;}
  const g=score>=300?'Bravo Zulu — traffic kept moving under pressure.':score>=150?'Mission accomplished, with costs.':score>=0?'The strait stayed open, barely.':'The strait effectively closed on your watch.';
  $('#ov').classList.remove('hide');$('#brief').innerHTML=`<h1>Watch complete</h1><div class="dim">${esc(why)} · ${clockStr(T)}</div>
  <p class="big" style="color:var(--accent)">${score}</p><p>${g}</p>
  <table><tr><td>Strait transits</td><td>${stats.transits}</td></tr><tr><td>Other port arrivals</td><td>${stats.voyages||0}</td></tr><tr><td>Seized / freed</td><td>${stats.seized} / ${stats.freed}</td></tr><tr><td>Merchants hit / lost</td><td>${stats.hit} / ${stats.sunk}</td></tr>
  <tr><td>US units lost</td><td>${stats.usnLost}</td></tr><tr><td>Iranian units destroyed</td><td>${stats.irnKilled}</td></tr><tr><td>Civilians killed</td><td>${stats.civKilled}</td></tr><tr><td>Mines cleared</td><td>${stats.mines}</td></tr><tr><td>Submarines sunk</td><td>${stats.subs}</td></tr><tr><td>Nuclear sites destroyed</td><td>${intelDone?stats.nukes+' of '+NUKES.length:'no strike ordered'}</td></tr><tr><td>Final tension</td><td>${tension.toFixed(0)}</td></tr></table>
  <button class="b on go" data-act="restart">New watch</button>`;}

/* ---------------- loop ---------------- */
let acc=0,t1=0,tD=0,last=performance.now(),uiT=0;
function step(dt){T+=dt;
  for(let i=0;i<ents.length;i++){const e=ents[i];if(e.dead||e.gone)continue;
    if(e.kind==='PRJ')updPrj(e,dt);else if(e.side==='usn')updUSN(e,dt);else if(e.side==='merchant')updMerchant(e,dt);else if(e.kind!=='MINE')updIran(e,dt);}
  launchQueues();t1+=dt;if(t1>=1){t1-=1;tick1();}tD+=dt;if(tD>=20){tD-=20;director();}
  if(ents.some(e=>e.dead||e.gone)){for(const e of ents)if(e.dead||e.gone)idx.delete(e.id);ents=ents.filter(e=>!(e.dead||e.gone));if(selU&&!idx.has(selU))selU=null;if(selC&&!idx.has(selC))selC=null;}
  if(T>=DUR)endGame(`${H}-hour watch complete`);else if(!ents.some(e=>e.side==='usn'&&(e.kind==='SHIP'||e.kind==='SUB')))endGame('All combatants lost');}
function frame(now){const rdt=Math.min(.25,(now-last)/1000);last=now;
  if(running&&comp>0){acc+=rdt*comp;let n=0;while(acc>=.5&&n<400&&running){step(.5);acc-=.5;n++;}}
  draw();if(now-uiT>220){uiT=now;updateUI();}if(started&&!over&&now-(frame.sv||0)>30000){frame.sv=now;saveGame(false);}requestAnimationFrame(frame);}
window.__sim={dbg:()=>({NODES,EDGES,inLand,shortest,BASES}),view:(x,y,s)=>{view.cx=x;view.cy=y;view.s=s;},step:n=>{for(let i=0;i<n;i++)step(.5);},get:()=>({T,ents,stats,score,tension}),act,setROE:r=>roe=r};

readTokens();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTokens);
new ResizeObserver(()=>{const first=!cv.width||cv.width<=1;resize();if(first||!view._f){fit();view._f=1;}}).observe($('#mapwrap'));
document.querySelectorAll('#layers [data-act=layer]').forEach(b=>b.classList.toggle('on',!!layers[b.dataset.arg]));resize();fit();setup();showBrief(false);updateUI(true);requestAnimationFrame(frame);
})();
</script>
</body>
